<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice-to-SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f2ede0;
    --panel: #faf7ee;
    --bubble-user: #1c1c1c;
    --bubble-assistant: #ffffff;
    --ink: #1a2a1d;
    --ink-soft: #5b6b56;
    --accent: #1c3324;
    --accent-hover: #142419;
    --gold: #b6884c;
    --gold-soft: #e4d3ab;
    --border: #e2dbc4;
    --danger: #9c3b2e;
    --danger-soft: #f3e2dd;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .app {
    display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto;
    background: var(--bg);
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; flex-shrink: 0; gap: 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(26,42,29,0.02), 0 4px 14px rgba(26,42,29,0.04);
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(155deg, #24402c, #16241a);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .brand-text { min-width: 0; }
  .brand h1 {
    font-family: "Playfair Display", serif; font-weight: 700; font-size: 1.18rem;
    margin: 0; line-height: 1.15; letter-spacing: -0.01em;
  }
  #datasetLabel {
    font-size: 0.74rem; color: var(--ink-soft); display: flex; align-items: center; gap: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #datasetLabel .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; animation: none; }

  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: transparent;
    border: 1px solid transparent; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: #ece5d2; color: var(--ink); }

  /* ---- scrollable chat ---- */
  #chat { flex: 1; overflow-y: auto; padding: 20px 24px 16px; }

  .welcome { padding: 40px 12px 24px; }
  .welcome .subtitle {
    font-family: "Playfair Display", serif; font-style: italic; font-weight: 500;
    color: var(--ink-soft); font-size: 1.25rem; margin: 0 0 22px;
  }
  #examples { color: var(--ink-soft); font-size: 0.83rem; line-height: 1.8; }
  #examples code {
    background: var(--gold-soft); color: #5a4322; padding: 3px 9px; border-radius: 7px; cursor: pointer;
    font-size: 0.79rem; font-family: "Inter", sans-serif; transition: background 0.15s;
  }
  #examples code:hover, .suggest-row code:hover { background: #d8c393; }
  .suggest-row {
    color: var(--ink-soft); font-size: 0.83rem; line-height: 2; margin: 0 0 18px 40px;
  }
  .suggest-row code {
    background: var(--gold-soft); color: #5a4322; padding: 3px 9px; border-radius: 7px; cursor: pointer;
    font-size: 0.79rem; font-family: "Inter", sans-serif; transition: background 0.15s;
  }
  #examples.muted { font-style: italic; }

  .msg-row { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .avatar.assistant-avatar { background: linear-gradient(155deg, #24402c, #16241a); }
  .avatar.user-avatar { background: var(--gold-soft); color: #5a4322; }

  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg.user { align-items: flex-end; flex: 0 1 auto; max-width: 82%; }
  .msg.assistant { align-items: flex-start; flex: 1 1 auto; min-width: 0; }
  .msg-meta {
    display: flex; align-items: center; gap: 6px; font-size: 0.74rem;
    color: var(--ink-soft); margin-bottom: 5px; padding: 0 4px;
  }
  .msg-meta .who { font-weight: 600; color: var(--ink); }
  .msg-meta .check { color: var(--gold); }
  .bubble { max-width: 100%; border-radius: 18px; padding: 12px 16px; }
  .msg.user .bubble { background: var(--bubble-user); color: #f5f2ea; font-size: 0.96rem; }
  .msg.assistant .bubble {
    background: var(--bubble-assistant); border: 1px solid var(--border);
    width: 100%; box-shadow: 0 1px 2px rgba(26,42,29,0.03);
  }

  .thinking { display: flex; gap: 4px; padding: 4px 2px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .sql {
    background: #16241a; color: #cfe0c9; padding: 11px 14px;
    border-radius: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; margin-bottom: 10px;
  }
  .answer-line {
    font-size: 0.98rem; font-weight: 500; line-height: 1.5; color: var(--ink);
    padding: 2px 0 2px 12px; border-left: 3px solid var(--gold); margin-bottom: 12px;
  }
  .answer-line.loading { color: var(--ink-soft); font-style: italic; font-weight: 400; }
  .chart-toggle { display: inline-flex; background: #ece5d2; border-radius: 14px; padding: 2px; margin-bottom: 6px; }
  .seg {
    background: transparent; color: var(--ink-soft); font-size: 0.72rem; font-weight: 500;
    padding: 4px 13px; border-radius: 12px;
  }
  .seg:hover { color: var(--ink); }
  .seg.active { background: var(--accent); color: var(--panel); }
  .result-actions { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .action-btn {
    display: flex; align-items: center; gap: 5px;
    background: #ece5d2; border: none; color: var(--ink-soft);
    padding: 5px 11px; border-radius: 16px; cursor: pointer;
    font-size: 0.73rem; font-weight: 500; font-family: "Inter", sans-serif;
  }
  .action-btn:hover { background: #e2d9c0; color: var(--ink); }
  .action-btn svg { flex-shrink: 0; }
  .explanation {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 0.92rem;
    color: var(--ink); background: #f6f2e4; border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; margin-bottom: 10px; line-height: 1.5;
  }
  .status-line { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 8px; }
  .scalar { font-family: "Playfair Display", serif; font-size: 1.6rem; font-weight: 600; padding: 6px 0; }
  .error-box { color: var(--danger); background: var(--danger-soft); padding: 11px 14px; border-radius: 10px; }
  .system-note {
    align-self: center; color: var(--ink-soft); font-size: 0.78rem;
    background: #ece5d2; padding: 6px 14px; border-radius: 20px; margin-bottom: 18px;
  }

  .confirm-box {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f6ecd6; border: 1px solid var(--gold-soft); padding: 11px 14px;
    border-radius: 10px; margin-top: 10px; font-size: 0.88rem;
  }

  .table-scroll { max-width: 100%; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.81rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; white-space: nowrap; }
  th { background: #efe9d8; font-weight: 600; font-family: "Inter", sans-serif; }
  tr:nth-child(even) td { background: #f8f4e8; }

  .insights { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
  .insight {
    display: flex; align-items: center; gap: 6px; font-size: 0.76rem; line-height: 1.35;
    padding: 4px 10px; border-radius: 12px; background: #f3efe2; color: var(--ink);
  }
  .insight .ico { font-size: 0.62rem; flex-shrink: 0; }
  .insight.up { background: #e3eddc; } .insight.up .ico { color: #2f6b3a; }
  .insight.down { background: var(--danger-soft); } .insight.down .ico { color: var(--danger); }
  .insight.info .ico { color: var(--gold); }
  .chart-note { font-size: 0.74rem; color: var(--ink-soft); margin: 2px 0 8px; }
  .drillable { cursor: pointer; transition: opacity 0.12s; }
  .drillable:hover { opacity: 0.78; }
  .orig-note { font-size: 0.72rem; color: var(--ink-soft); margin: 4px 4px 0; font-style: italic; text-align: right; }

  .health-card { font-size: 0.82rem; }
  .health-card h4 { font-family: "Playfair Display", serif; font-size: 1.05rem; margin: 0 0 8px; }
  .health-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge-pill { padding: 3px 10px; border-radius: 12px; background: #e3eddc; font-size: 0.74rem; font-weight: 500; }
  .badge-pill.warn { background: #f6e6c4; color: #6b4a14; }
  .health-card td.warn { background: #f6e6c4 !important; font-weight: 600; }
  .health-card .suggest-row { margin: 10px 0 0; }
  .er-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 6px; }

  .sql-editor textarea {
    width: 100%; min-height: 84px; resize: vertical; background: #16241a; color: #cfe0c9;
    border: 1px solid #2c4635; border-radius: 10px; padding: 11px 14px; outline: none;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.78rem; line-height: 1.5;
  }
  .sql-editor { margin-bottom: 10px; }
  .sql-editor .editor-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .sql-editor .editor-error { color: var(--danger); font-size: 0.78rem; flex: 1; }

  .badge { background: var(--gold); color: #fff; border-radius: 9px; font-size: 0.66rem; padding: 1px 6px; margin-left: 2px; }

  /* ---- report / dashboard overlay ---- */
  #reportView { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
  #reportView[hidden] { display: none; }
  .report-toolbar {
    position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .report-tabs { display: inline-flex; background: #ece5d2; border-radius: 14px; padding: 2px; }
  .report-actions { display: flex; gap: 8px; }
  .report-page { max-width: 1040px; margin: 0 auto; padding: 24px; }
  .report-page h1 { font-family: "Playfair Display", serif; margin: 0 0 4px; font-size: 1.7rem; }
  .report-meta { color: var(--ink-soft); font-size: 0.82rem; margin-bottom: 20px; }
  .report-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .report-grid.dashboard { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  .report-card {
    background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px;
    box-shadow: 0 1px 2px rgba(26,42,29,0.04); break-inside: avoid; position: relative; min-width: 0;
  }
  .report-card h3 { margin: 0 0 8px; font-size: 0.95rem; }
  .report-card .answer-line { font-size: 0.9rem; }
  .report-card .chart-holder svg { max-width: 100%; height: auto; }
  .report-card .sql-small { font-family: ui-monospace, Menlo, monospace; font-size: 0.68rem; color: var(--ink-soft); margin-top: 8px; white-space: pre-wrap; }
  .report-card .unpin { position: absolute; top: 10px; right: 12px; background: transparent; color: var(--ink-soft); font-size: 0.74rem; }
  .report-empty { color: var(--ink-soft); padding: 40px 0; text-align: center; }
  @media print {
    .app, .report-toolbar { display: none !important; }
    #reportView { position: static; overflow: visible; background: #fff; }
    .report-page { max-width: none; padding: 0; }
    .report-grid.dashboard { grid-template-columns: 1fr 1fr; }
    .report-card { box-shadow: none; }
  }

  /* ---- composer ---- */
  .composer-wrap { flex-shrink: 0; padding: 10px 24px 20px; background: var(--bg); }

  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .pill-btn {
    display: flex; align-items: center; gap: 5px;
    background: transparent; border: none; color: var(--ink-soft);
    padding: 5px 10px; border-radius: 20px; cursor: pointer;
    font-size: 0.74rem; font-weight: 500; font-family: "Inter", sans-serif;
  }
  .pill-btn:hover { background: #ece5d2; color: var(--ink); }
  .pill-btn svg { flex-shrink: 0; }
  .pill-btn.on { background: var(--gold-soft); color: #5a4322; }

  .dataset-chips { display: none; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip {
    display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;
    padding: 5px 11px; border-radius: 16px; font-size: 0.74rem; font-weight: 500;
    border: 1px solid var(--border); background: transparent; color: var(--ink-soft);
  }
  .chip:hover { background: #ece5d2; color: var(--ink); }
  .chip.selected { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .chip .chip-meta { opacity: 0.65; font-weight: 400; }
  .chip .chip-remove {
    width: 16px; height: 16px; border-radius: 50%; margin-right: -6px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: inherit; font-size: 0.95rem; line-height: 1; opacity: 0.7;
  }
  .chip .chip-remove:hover { opacity: 1; background: rgba(0,0,0,0.12); }

  #recordingBar {
    display: none; flex-direction: column; gap: 6px;
    margin-bottom: 10px; padding: 12px 15px;
    background: var(--danger-soft); border: 1px solid #e6bdb1; border-radius: 12px;
  }
  #recordingBar.active { display: flex; }
  .recordingHead { display: flex; align-items: center; gap: 10px; font-size: 0.83rem; color: var(--danger); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  #liveCaption {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 1rem;
    color: #6b2f24; min-height: 1.3em;
  }

  #queryForm {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border);
    border-radius: 26px; padding: 6px 6px 6px 18px; box-shadow: 0 1px 2px rgba(26,42,29,0.04), 0 8px 20px rgba(26,42,29,0.05);
  }
  #text {
    flex: 1; border: none; outline: none; font-size: 1rem; font-family: "Inter", sans-serif;
    background: transparent; color: var(--ink); padding: 10px 0;
  }
  #text::placeholder { color: #9aa596; }

  button { border: none; cursor: pointer; font-family: "Inter", sans-serif; transition: background 0.15s; }

  #sendBtn {
    width: 42px; height: 42px; border-radius: 50%; background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #sendBtn:hover { background: #000; }
  #sendBtn svg { margin-left: -1px; }

  .secondary { padding: 9px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 11px; background: #ece5d2; color: var(--ink); }
  .secondary:hover { background: #e2d9c0; }
  .primary { padding: 9px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 11px; background: var(--accent); color: var(--panel); }
  .primary:hover { background: var(--accent-hover); }

  #micBtn {
    background: transparent; color: var(--ink-soft); border-radius: 50%;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #micBtn:hover { background: #ece5d2; }
  #micBtn.recording { color: var(--danger); }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    .brand h1 { font-size: 1.02rem; }
    .logo-mark { width: 32px; height: 32px; }
    #chat { padding: 14px 14px 12px; }
    .composer-wrap { padding: 8px 14px 16px; }
    #queryForm { padding: 4px 4px 4px 14px; }
    .msg.user { max-width: 90%; }
    .avatar { width: 26px; height: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8dfc8" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19v-6"/></svg>
      </div>
      <div class="brand-text">
        <h1>Voice-to-SQL</h1>
        <div id="datasetLabel"><span class="dot"></span><span id="datasetLabelText">Sales data</span></div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="pill-btn" id="reportBtn" title="Pinned results and this chat, ready to print or save as a PDF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/></svg>
        <span>Report</span><span class="badge" id="pinBadge" hidden>0</span>
      </button>
      <button type="button" class="icon-btn" id="newChatBtn" title="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <p class="subtitle">Type it, or just say it — I'll turn it into a query.</p>
      <div id="examples" class="suggest"></div>
    </div>
    <div id="messages"></div>
  </div>

  <div class="composer-wrap">
    <div class="dataset-chips" id="datasetChips"></div>
    <div class="toolbar">
      <input type="file" id="csvInput" accept=".csv,.xlsx,.xlsm" multiple style="display:none" />
      <button type="button" class="pill-btn" id="uploadBtn" title="CSV or Excel (.xlsx) — each file (or Excel sheet) becomes a table you can join">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Upload datasets
      </button>
      <button type="button" class="pill-btn" id="langBtn" title="The language you speak your questions in. Hindi / Hinglish is turned into an English question for you.">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>
        <span>Voice: English</span>
      </button>
      <button type="button" class="pill-btn" id="speakBtn" style="display:none" title="Read each answer aloud (answers to questions you speak are always read)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        <span>Voice replies: off</span>
      </button>
    </div>

    <div id="recordingBar">
      <div class="recordingHead">
        <div class="dot"></div>
        <span>Listening — <span id="timer">0:30</span></span>
      </div>
      <div id="liveCaption">Say something...</div>
    </div>

    <form id="queryForm">
      <input id="text" type="text" placeholder="Ask something about the data..." autocomplete="off" autofocus />
      <button type="button" id="micBtn" title="Record a question">
        <svg id="micIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>
        <svg id="stopIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button type="submit" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6l17.5-8.4a1 1 0 0 0 0-1.8L3.4 1.9a1 1 0 0 0-1.4 1.1L4 11 2 20a1 1 0 0 0 1.4 1.1z"/></svg>
      </button>
    </form>
  </div>
</div>

<div id="reportView" hidden>
  <div class="report-toolbar">
    <div class="report-tabs">
      <button type="button" class="seg active" data-tab="pinned">Pinned</button>
      <button type="button" class="seg" data-tab="chat">This chat</button>
    </div>
    <div class="report-actions">
      <button type="button" class="primary" id="reportPrint">Print / Save as PDF</button>
      <button type="button" class="secondary" id="reportClose">Close</button>
    </div>
  </div>
  <div class="report-page" id="reportPage"></div>
</div>

<script>
// Chart colors follow the app palette instead of Mermaid's default pale lavender
// (which made bars nearly invisible on the cream background).
const CHART_COLORS = ['#1c3324', '#b6884c', '#5b7d5f', '#d6b777', '#7a5c3a', '#8fae8b',
                      '#3f5a45', '#a3704a', '#c9d6b8', '#6f8f73', '#e4d3ab', '#9c3b2e'];
const themeVariables = {
  fontFamily: 'Inter, sans-serif',
  primaryColor: '#e4d3ab', primaryTextColor: '#1a2a1d', primaryBorderColor: '#b6884c',
  lineColor: '#5b6b56', secondaryColor: '#f2ede0', tertiaryColor: '#faf7ee',
  pieOpacity: '1', pieOuterStrokeWidth: '0px', pieStrokeColor: '#faf7ee', pieStrokeWidth: '2px',
  xyChart: { plotColorPalette: CHART_COLORS.join(',') },
};
// Pie slices carry white percentage labels, so every slice color must be dark enough for them.
const PIE_COLORS = ['#1c3324', '#b6884c', '#5b7d5f', '#7a5c3a', '#3f5a45', '#a3704a',
                    '#6f8f73', '#9c3b2e', '#8a6d2f', '#4d6b7a', '#7d4e6b', '#5a5a3a'];
PIE_COLORS.forEach((c, i) => { themeVariables[`pie${i + 1}`] = c; });
themeVariables.pieSectionTextColor = '#ffffff';
mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables });

const chatEl = document.getElementById('chat');
const welcomeEl = document.getElementById('welcome');
const messagesEl = document.getElementById('messages');
const newChatBtn = document.getElementById('newChatBtn');
const datasetLabelText = document.getElementById('datasetLabelText');

const form = document.getElementById('queryForm');
const textInput = document.getElementById('text');
const micBtn = document.getElementById('micBtn');
const micIcon = document.getElementById('micIcon');
const stopIcon = document.getElementById('stopIcon');
const recordingBar = document.getElementById('recordingBar');
const timerEl = document.getElementById('timer');
const liveCaptionEl = document.getElementById('liveCaption');

const csvInput = document.getElementById('csvInput');
const uploadBtn = document.getElementById('uploadBtn');
const datasetChipsEl = document.getElementById('datasetChips');

const RECORD_SECONDS = 30;
const LIVE_TRANSCRIBE_INTERVAL_MS = 3000;

let countdownInterval = null;
let autoStopTimeout = null;

// Conversation memory for this page session — lets a follow-up like "now
// break that down by region" resolve "that" against what was already asked.
// Sent to the server with every /query call; only the Ollama fallback uses
// it (see nl2sql.py). Cleared on page reload or via "New chat".
let conversationHistory = [];

// Datasets that can be queried: the built-in `sales` table plus one table per
// uploaded CSV. `selected` is what /query runs against — more than one means
// the question can join/merge them (see nl2sql.py::ollama_fallback).
let datasets = [{ name: 'sales', label: 'Sales data' }];
const selected = new Set(['sales']);

// --- Voice input: faster-whisper, with periodic re-transcription while
// recording so the input updates "live" as you talk, not just at the end.
let mediaRecorder = null;
let recordedChunks = [];
let liveTranscribeTimer = null;
let transcribing = false;
let recording = false;
let lastTranscript = ''; // last successful transcription this recording, used as a
                          // fallback if the final call lands while a periodic one is in-flight

// Starter questions: fixed ones the rule engine is known to handle for the
// sample data; for uploaded datasets they're generated from the schema.
const SALES_EXAMPLES = [
  'top 5 brands by quantity sold',
  'how many laptops in west region',
  'average price of samsung phones',
  'delete 2 laptops in central region',
];
const examplesEl = document.getElementById('examples');

function fillSuggestions(container, questions) {
  container.classList.remove('muted');
  container.replaceChildren(document.createTextNode('Try: '));
  questions.forEach((q, i) => {
    if (i) container.appendChild(document.createTextNode(' · '));
    const code = document.createElement('code');
    code.textContent = q;
    container.appendChild(code);
  });
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('.suggest code, .suggest-row code');
  if (!chip) return;
  textInput.value = chip.textContent;
  form.requestSubmit();
});

let suggestTimer = null;
let suggestSeq = 0;

function scheduleSuggestions(announce = false) {
  clearTimeout(suggestTimer);
  suggestTimer = setTimeout(() => refreshSuggestions(announce), 350);
}

async function refreshSuggestions(announce) {
  const picked = Array.from(selected);
  if (picked.length === 1 && picked[0] === 'sales') {
    suggestSeq++;
    fillSuggestions(examplesEl, SALES_EXAMPLES);
    return;
  }
  const seq = ++suggestSeq;
  examplesEl.classList.add('muted');
  examplesEl.textContent = 'Thinking of questions to ask about your data…';
  try {
    const resp = await fetch('/suggest-questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tables: picked }),
    });
    const data = await resp.json();
    if (seq !== suggestSeq) return; // selection changed while this was loading
    if (!resp.ok || !data.questions.length) throw new Error('no suggestions');
    fillSuggestions(examplesEl, data.questions);
    if (announce) {
      const row = document.createElement('div');
      row.className = 'suggest-row';
      fillSuggestions(row, data.questions);
      messagesEl.appendChild(row);
      scrollToBottom();
    }
  } catch {
    if (seq !== suggestSeq) return;
    examplesEl.classList.add('muted');
    examplesEl.textContent = 'Ask anything about your data.';
  }
}
fillSuggestions(examplesEl, SALES_EXAMPLES);

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = textInput.value;
  textInput.value = '';
  sendMessage(text, false);
});

newChatBtn.addEventListener('click', () => {
  conversationHistory = [];
  messagesEl.innerHTML = '';
  welcomeEl.style.display = '';
});

micBtn.addEventListener('click', () => {
  if (recording) stopRecording();
  else startRecording();
});

// --- Dataset upload --------------------------------------------------------

uploadBtn.addEventListener('click', () => csvInput.click());

csvInput.addEventListener('change', async () => {
  const files = Array.from(csvInput.files);
  csvInput.value = '';
  const loaded = [];
  let lastEr = null;

  for (const file of files) {
    addSystemNote(`Loading ${file.name}...`);
    const form = new FormData();
    form.append('file', file);

    let resp, data;
    try {
      resp = await fetch('/upload-dataset', { method: 'POST', body: form });
      data = await resp.json();
    } catch (err) {
      addSystemNote(`Upload failed for ${file.name}: ${err}`);
      continue;
    }
    if (!resp.ok) {
      addSystemNote(`${file.name}: ${(data && data.detail) || 'Upload failed.'}`);
      continue;
    }

    if (data.er_diagram) lastEr = data.er_diagram;
    // One file can yield several tables (an Excel workbook: one per sheet).
    for (const info of data.datasets) {
      upsertDataset(info);
      loaded.push(info.table);
      const where = info.sheet ? ` (sheet "${info.sheet}")` : '';
      addSystemNote(
        `${info.replaced ? 'Replaced' : 'Loaded'} ${info.table}${where} — ${info.row_count.toLocaleString()} rows, columns: ${info.columns.join(', ')}`
      );
      if (info.profile) showHealthCard(info.profile);
    }
  }

  if (!loaded.length) return;
  // First upload moves off the sample data; later uploads join the selection.
  if (selected.size === 1 && selected.has('sales')) selected.delete('sales');
  loaded.forEach(name => selected.add(name));
  conversationHistory = []; // different datasets — old follow-up context no longer applies
  renderDatasets();
  if (selected.size > 1) addSystemNote('Several datasets selected — you can ask questions that span them.');
  if (lastEr && lastEr.includes('--')) showRelationships(lastEr); // "--" only appears on a detected link
  scheduleSuggestions(true);
});

function upsertDataset(info) {
  const entry = { name: info.table, label: info.table, rows: info.row_count, uploaded: true };
  const i = datasets.findIndex(d => d.name === entry.name);
  if (i >= 0) datasets[i] = entry;
  else datasets.push(entry);
}

function toggleDataset(name) {
  if (selected.has(name)) {
    if (selected.size === 1) return; // always keep one dataset to query
    selected.delete(name);
  } else {
    selected.add(name);
  }
  conversationHistory = [];
  renderDatasets();
  scheduleSuggestions();
}

async function removeDataset(name) {
  try {
    const resp = await fetch(`/datasets/${encodeURIComponent(name)}`, { method: 'DELETE' });
    if (!resp.ok) throw new Error(resp.statusText);
  } catch (err) {
    addSystemNote(`Couldn't remove ${name}: ${err.message || err}`);
    return;
  }
  datasets = datasets.filter(d => d.name !== name);
  selected.delete(name);
  if (!selected.size) selected.add('sales');
  conversationHistory = [];
  renderDatasets();
  addSystemNote(`Removed ${name}.`);
  scheduleSuggestions();
}

function renderDatasets() {
  datasetChipsEl.innerHTML = '';
  datasets.forEach(ds => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (selected.has(ds.name) ? ' selected' : '');
    chip.title = selected.has(ds.name) ? 'Click to exclude from queries' : 'Click to include in queries';
    chip.innerHTML = '<span></span>';
    chip.firstChild.textContent = ds.label;
    if (ds.rows !== undefined) {
      const meta = document.createElement('span');
      meta.className = 'chip-meta';
      meta.textContent = `· ${ds.rows.toLocaleString()}`;
      chip.appendChild(meta);
    }
    chip.addEventListener('click', () => toggleDataset(ds.name));
    if (ds.uploaded) {
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'chip-remove';
      rm.title = `Remove ${ds.name}`;
      rm.textContent = '×';
      rm.addEventListener('click', (e) => { e.stopPropagation(); removeDataset(ds.name); });
      chip.appendChild(rm);
    }
    datasetChipsEl.appendChild(chip);
  });
  datasetChipsEl.style.display = datasets.length > 1 ? 'flex' : 'none';

  const picked = datasets.filter(d => selected.has(d.name));
  datasetLabelText.textContent = picked.length === 1
    ? (picked[0].rows !== undefined ? `${picked[0].label} · ${picked[0].rows.toLocaleString()} rows` : picked[0].label)
    : `${picked.length} datasets · ${picked.map(d => d.label).join(' + ')}`;
}

// Uploaded tables persist in the database, so offer them again after a reload.
fetch('/datasets').then(r => r.json()).then(d => {
  d.datasets.forEach(upsertDataset);
  renderDatasets();
}).catch(() => {});

// --- Reading answers aloud (browser speech synthesis) -----------------------

const speakBtn = document.getElementById('speakBtn');
const canSpeak = 'speechSynthesis' in window;
let speakReplies = false;
try { speakReplies = localStorage.getItem('speakReplies') === '1'; } catch { /* storage unavailable */ }

function renderSpeakToggle() {
  speakBtn.classList.toggle('on', speakReplies);
  speakBtn.querySelector('span').textContent = `Voice replies: ${speakReplies ? 'on' : 'off'}`;
}
if (canSpeak) {
  speakBtn.style.display = '';
  renderSpeakToggle();
  speakBtn.addEventListener('click', () => {
    speakReplies = !speakReplies;
    if (!speakReplies) speechSynthesis.cancel();
    try { localStorage.setItem('speakReplies', speakReplies ? '1' : '0'); } catch { /* storage unavailable */ }
    renderSpeakToggle();
  });
}

function speakText(text, btn) {
  if (!canSpeak || !text) return;
  speechSynthesis.cancel(); // also resets the label of whichever Listen button was mid-read
  const utterance = new SpeechSynthesisUtterance(text);
  const setState = (on) => {
    if (!btn) return;
    btn.dataset.speaking = on ? '1' : '';
    btn.querySelector('span').textContent = on ? 'Stop' : 'Listen';
  };
  utterance.onstart = () => setState(true);
  utterance.onend = utterance.onerror = () => setState(false);
  speechSynthesis.speak(utterance);
}

function addSystemNote(text) {
  welcomeEl.style.display = 'none';
  const note = document.createElement('div');
  note.className = 'system-note';
  note.textContent = text;
  messagesEl.appendChild(note);
  scrollToBottom();
}

// --- Chat rendering --------------------------------------------------------

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function formatTime() {
  return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function checkmarkIcon() {
  return '<svg class="check" width="14" height="10" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5.5L4.5 9L11 1.5"/><path d="M5.5 5.5L9 9L15.5 1.5"/></svg>';
}

function userAvatar() {
  const div = document.createElement('div');
  div.className = 'avatar user-avatar';
  div.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>';
  return div;
}

function assistantAvatar() {
  const div = document.createElement('div');
  div.className = 'avatar assistant-avatar';
  div.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8dfc8" stroke-width="2.4" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19v-6"/></svg>';
  return div;
}

function addUserMessage(text, original) {
  welcomeEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const msg = document.createElement('div');
  msg.className = 'msg user';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="who">You</span>${checkmarkIcon()}<span>${formatTime()}</span>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.append(meta, bubble);
  if (original) {
    const note = document.createElement('div');
    note.className = 'orig-note';
    note.textContent = `You said: ${original}`;
    msg.appendChild(note);
  }
  row.append(userAvatar(), msg);
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addAssistantMessage() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="who">Assistant</span><span>${formatTime()}</span>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  msg.append(meta, bubble);
  row.append(assistantAvatar(), msg);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

// --- Recording UI ------------------------------------------------------

function beginRecordingUI() {
  recording = true;
  micBtn.classList.add('recording');
  micIcon.style.display = 'none';
  stopIcon.style.display = '';
  recordingBar.classList.add('active');
  liveCaptionEl.textContent = 'Say something...';
  startCountdown();
}

function endRecordingUI() {
  recording = false;
  micBtn.classList.remove('recording');
  micIcon.style.display = '';
  stopIcon.style.display = 'none';
  recordingBar.classList.remove('active');
  clearInterval(countdownInterval);
  clearTimeout(autoStopTimeout);
  clearInterval(liveTranscribeTimer);
}

function startCountdown() {
  let remaining = RECORD_SECONDS;
  timerEl.textContent = `0:${String(remaining).padStart(2, '0')}`;
  countdownInterval = setInterval(() => {
    remaining -= 1;
    timerEl.textContent = `0:${String(Math.max(remaining, 0)).padStart(2, '0')}`;
    if (remaining <= 0) clearInterval(countdownInterval);
  }, 1000);
  autoStopTimeout = setTimeout(() => stopRecording(), RECORD_SECONDS * 1000);
}

// --- Voice input: faster-whisper, periodically re-transcribing the
// in-progress recording so the caption updates "live" as you talk, then a
// final transcribe of the complete clip once you stop.

async function startRecording() {
  if (canSpeak) speechSynthesis.cancel(); // otherwise the mic would record the app talking

  // Browsers only expose the microphone API on secure pages: https, or
  // http://localhost. Opened via a network address (192.168.x.x, 0.0.0.0, a
  // hostname) navigator.mediaDevices doesn't exist at all.
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const hint = window.isSecureContext
      ? "This browser doesn't support microphone recording."
      : `Browsers only allow the microphone on secure pages. Open this app at http://localhost:8000 instead of ${location.host}.`;
    addAssistantMessage().innerHTML = `<div class="error-box">${hint} You can still type your question.</div>`;
    return;
  }

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    addAssistantMessage().innerHTML = `<div class="error-box">Couldn't access the microphone: ${err.message || err}</div>`;
    return;
  }

  recordedChunks = [];
  lastTranscript = '';
  textInput.value = ''; // clear stale text so a failed/empty recording can't resend old text
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(liveTranscribeTimer);
    // If a periodic call is mid-flight right as we stop, wait for it rather
    // than skipping straight to a (possibly redundant) final transcription.
    while (transcribing) await new Promise(r => setTimeout(r, 100));
    const finalText = (await transcribeCurrentRecording(/* isFinal */ true)) || lastTranscript;
    endRecordingUI();
    if (finalText) sendMessage(finalText, false, undefined, undefined, { viaVoice: true, original: lastOriginal });
    else addAssistantMessage().innerHTML = '<div class="error-box">Didn\'t catch any speech, try again.</div>';
  };

  // timeslice: fires ondataavailable periodically while still recording, so
  // we have something to re-transcribe for the live caption without waiting
  // for the whole recording to finish.
  mediaRecorder.start(LIVE_TRANSCRIBE_INTERVAL_MS);
  beginRecordingUI();

  liveTranscribeTimer = setInterval(() => transcribeCurrentRecording(false), LIVE_TRANSCRIBE_INTERVAL_MS);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

// Hindi / Hinglish mode: the live caption shows what was heard in the language
// spoken; the final call also has the model turn it into an English question.
let lastOriginal = '';

async function transcribeCurrentRecording(isFinal) {
  // Skip overlapping calls, and wait for at least 2 chunks — a lone first
  // chunk is sometimes not yet a fully decodable container.
  if (transcribing || recordedChunks.length < 2) return isFinal ? '' : undefined;
  transcribing = true;
  try {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const form = new FormData();
    const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
    form.append('file', blob, `recording.${ext}`);

    let resp, data;
    try {
      const params = new URLSearchParams();
      if (voiceLang === 'hi') {
        params.set('multilingual', 'true');
        if (isFinal) {
          params.set('to_english', 'true');
          params.set('tables', Array.from(selected).join(','));
        }
      }
      resp = await fetch(`/transcribe?${params}`, { method: 'POST', body: form });
      data = await resp.json();
    } catch {
      return isFinal ? '' : undefined; // transient failure — try again next tick unless this was the final call
    }
    if (!resp.ok) return isFinal ? '' : undefined;

    lastOriginal = data.original && data.original !== data.text ? data.original : '';
    liveCaptionEl.textContent = lastOriginal ? `${data.original}  →  ${data.text}` : (data.text || 'Say something...');
    textInput.value = data.text || '';
    if (data.text) lastTranscript = data.text;
    return data.text || '';
  } finally {
    transcribing = false;
  }
}

// --- Voice language ----------------------------------------------------------

const langBtn = document.getElementById('langBtn');
let voiceLang = 'en';
try { voiceLang = localStorage.getItem('voiceLang') || 'en'; } catch { /* storage unavailable */ }

function renderLang() {
  langBtn.classList.toggle('on', voiceLang === 'hi');
  langBtn.querySelector('span').textContent = voiceLang === 'hi' ? 'Voice: हिन्दी / Hinglish' : 'Voice: English';
}
langBtn.addEventListener('click', () => {
  voiceLang = voiceLang === 'hi' ? 'en' : 'hi';
  try { localStorage.setItem('voiceLang', voiceLang); } catch { /* storage unavailable */ }
  renderLang();
  if (voiceLang === 'hi') addSystemNote('Speak in Hindi or Hinglish — I\'ll show what I heard and the English question I understood. (First use loads a larger speech model, so it\'s slower.)');
});
renderLang();

// --- Data health card + how uploaded files connect ---------------------------

function showHealthCard(profile) {
  const card = document.createElement('div');
  card.className = 'health-card';
  const cells = profile.row_count * profile.columns.length;
  const emptyPct = cells ? Math.round(profile.empty_cells / cells * 100) : 0;

  const h = document.createElement('h4');
  h.textContent = `${profile.table} — ${profile.row_count.toLocaleString()} rows × ${profile.columns.length} columns`;
  const badges = document.createElement('div');
  badges.className = 'health-badges';
  const mk = (text, warn) => {
    const b = document.createElement('span');
    b.className = 'badge-pill' + (warn ? ' warn' : '');
    b.textContent = text;
    return b;
  };
  badges.append(
    mk(`${profile.duplicate_rows.toLocaleString()} duplicate row${profile.duplicate_rows === 1 ? '' : 's'}`, profile.duplicate_rows > 0),
    mk(`${profile.empty_cells.toLocaleString()} empty cell${profile.empty_cells === 1 ? '' : 's'} (${emptyPct}%)`, profile.empty_cells > 0),
  );

  const table = document.createElement('table');
  const head = document.createElement('tr');
  ['column', 'type', 'empty', 'distinct values'].forEach(t => { const th = document.createElement('th'); th.textContent = t; head.appendChild(th); });
  table.appendChild(head);
  profile.columns.forEach(c => {
    const tr = document.createElement('tr');
    [c.name, c.type, c.empty, c.distinct.toLocaleString()].forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 2 && c.empty > 0) td.className = 'warn';
      tr.appendChild(td);
    });
    table.appendChild(tr);
  });
  const scroll = document.createElement('div');
  scroll.className = 'table-scroll';
  scroll.appendChild(table);
  card.append(h, badges, scroll);

  // Cleaning commands that fit what was found, one click away.
  const fixes = [];
  if (profile.duplicate_rows > 0) fixes.push(`remove duplicate rows from ${profile.table}`);
  profile.columns.filter(c => c.empty > 0).slice(0, 2).forEach(c => {
    const numeric = c.type === 'INTEGER' || c.type === 'REAL';
    fixes.push(`fill empty ${c.name} with ${numeric ? 'the average' : 'Unknown'} in ${profile.table}`);
  });
  if (fixes.length) {
    const row = document.createElement('div');
    row.className = 'suggest-row';
    fillSuggestions(row, fixes);
    row.firstChild.textContent = 'Clean it: ';
    card.appendChild(row);
  }

  const bubble = addAssistantMessage();
  bubble.replaceChildren(card);
  scrollToBottom();
}

async function showRelationships(diagram) {
  const bubble = addAssistantMessage();
  const title = document.createElement('div');
  title.className = 'er-title';
  title.textContent = 'How your files connect';
  const div = document.createElement('div');
  div.className = 'mermaid';
  div.textContent = diagram;
  bubble.replaceChildren(title, div);
  try { await mermaid.run({ nodes: [div] }); } catch { bubble.textContent = 'Couldn\'t draw the relationships between these files.'; }
  scrollToBottom();
}

// After a cleaning command changes a table, bring the dataset chips back in sync.
async function refreshDatasets() {
  try {
    const d = await (await fetch('/datasets')).json();
    const alive = new Set(d.datasets.map(x => x.table));
    datasets = datasets.filter(x => !x.uploaded || alive.has(x.name));
    d.datasets.forEach(upsertDataset);
    renderDatasets();
    scheduleSuggestions();
  } catch { /* the chips just stay as they were */ }
}

// --- Editing a result's SQL by hand --------------------------------------------

function openSqlEditor(actionsWrap, data) {
  const bubble = actionsWrap.parentElement;
  const sqlEl = bubble.querySelector('.sql');
  if (!sqlEl || bubble.querySelector('.sql-editor')) return;

  const editor = document.createElement('div');
  editor.className = 'sql-editor';
  const area = document.createElement('textarea');
  area.value = data.sql;
  area.spellcheck = false;
  const row = document.createElement('div');
  row.className = 'editor-actions';
  const run = document.createElement('button');
  run.type = 'button'; run.className = 'primary'; run.textContent = 'Run';
  const cancel = document.createElement('button');
  cancel.type = 'button'; cancel.className = 'secondary'; cancel.textContent = 'Cancel';
  const err = document.createElement('div');
  err.className = 'editor-error';
  row.append(run, cancel, err);
  editor.append(area, row);
  sqlEl.replaceWith(editor);
  area.focus();

  cancel.addEventListener('click', () => editor.replaceWith(sqlEl));
  run.addEventListener('click', async () => {
    err.textContent = '';
    run.disabled = true;
    try {
      const resp = await fetch('/run-sql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql: area.value, text: 'Edited SQL', tables: data.tables || ['sales'] }),
      });
      const result = await resp.json();
      if (!resp.ok) { err.textContent = result.detail || 'That query failed.'; return; }
      editor.replaceWith(sqlEl);
      result.tables = data.tables;
      addUserMessage('Run my edited SQL');
      renderResult(addAssistantMessage(), result, {});
      conversationHistory.push({ text: 'Edited SQL', sql: result.sql });
      conversationHistory = conversationHistory.slice(-5);
    } catch (e) {
      err.textContent = `Request failed: ${e}`;
    } finally {
      run.disabled = false;
    }
  });
}

function renderPinBadge() {

const isPinned = (item) => pinned.some(p => p.id === item.id);

  if (isPinned(item)) {

  } else {
    if (pinned.length >= MAX_PINS) pinned.shift(); // keep the newest
    pinned.push(JSON.parse(JSON.stringify(item))); // snapshot: chart type and summary as they are now

}

// --- Query execution -------------------------------------------------------

async function sendMessage(text, confirm, existingBubble, forUserText, opts = {}) {
  if (!text.trim()) return;
  if (canSpeak) speechSynthesis.cancel(); // a new question cuts off the previous answer

  let bubble;
  if (existingBubble) {
    bubble = existingBubble;
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  } else {
    addUserMessage(text, opts.original);
    bubble = addAssistantMessage();
  }

  const tablesUsed = Array.from(selected);
  let resp, data;
  try {
    resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: forUserText || text, confirm, history: conversationHistory, tables: tablesUsed, drill: opts.drill || null }),
    });
    data = await resp.json();
  } catch (err) {
    bubble.innerHTML = `<div class="error-box">Request failed: ${err}</div>`;
    return;
  }

  if (!resp.ok) {
    bubble.innerHTML = `<div class="error-box">${(data && data.detail) || resp.statusText}</div>`;
    return;
  }

  if (data.requires_confirmation) {
    renderConfirm(bubble, data, forUserText || text);
    return;
  }

  data.tables = tablesUsed; // so Explain uses the schema this answer was run against
  renderResult(bubble, data, opts);

  conversationHistory.push({ text: forUserText || text, sql: data.sql });
  conversationHistory = conversationHistory.slice(-5);
}

function renderConfirm(bubble, data, originalText) {
  bubble.innerHTML = '';
  bubble.appendChild(sqlBlock(data));
  if (data.rows.length) bubble.appendChild(tableBlock(data.columns, data.rows));

  const box = document.createElement('div');
  box.className = 'confirm-box';
  const label = document.createElement('span');
  label.textContent = data.confirm_message || `This will affect ${data.rows.length} row(s). Run it?`;
  const yesBtn = document.createElement('button');
  yesBtn.className = 'primary';
  yesBtn.textContent = 'Yes, run it';
  yesBtn.addEventListener('click', () => sendMessage(originalText, true, bubble, originalText));
  const noBtn = document.createElement('button');
  noBtn.className = 'secondary';
  noBtn.textContent = 'Cancel';
  noBtn.addEventListener('click', () => {
    box.remove();
    const note = document.createElement('div');
    note.className = 'status-line';
    note.textContent = 'Cancelled.';
    bubble.appendChild(note);
  });
  box.append(label, yesBtn, noBtn);
  bubble.appendChild(box);
  scrollToBottom();
}

// The one-sentence answer for a result. `ctl.text` is filled in by the server
// for the common shapes, or fetched from /summarize for the rest; Listen
// buttons and auto-reading look at it whenever it changes.
function answerLine(ctl, data, opts, showLine) {
  const announce = () => { if (ctl.text && (opts.viaVoice || speakReplies)) speakText(ctl.text); };
  if (ctl.text) {
    announce();
    if (!showLine) return null;
    const el = document.createElement('div');
    el.className = 'answer-line';
    el.textContent = ctl.text;
    return el;
  }

  const el = document.createElement('div');
  el.className = 'answer-line loading';
  el.textContent = 'Summarizing…';
  fetch('/summarize', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: data.text, columns: data.columns, rows: data.rows.slice(0, 30) }),
  })
    .then(async (resp) => {
      const body = await resp.json();
      if (!resp.ok || !body.summary) throw new Error('no summary');
      ctl.text = body.summary;
      if (ctl.item) ctl.item.summary = body.summary;
      el.textContent = body.summary;
      el.classList.remove('loading');
      announce();
    })
    .catch(() => el.remove()) // the result is still fully usable without it
    .finally(() => { if (ctl.onChange) ctl.onChange(); });
  return el;
}

function renderResult(bubble, data, opts = {}) {
  bubble.innerHTML = '';

  if (data.notice) {
    // A statement rather than a table: "Removed 2 duplicate rows from orders."
    const line = document.createElement('div');
    line.className = 'answer-line';
    line.textContent = data.notice;
    bubble.appendChild(line);
    if (data.sql) bubble.appendChild(sqlBlock(data));
    if (data.source === 'clean') refreshDatasets(); // row counts / columns may have changed
    if (canSpeak && (opts.viaVoice || speakReplies)) speakText(data.notice);
    scrollToBottom();
    return;
  }

  if (data.is_diagram) {
    // Explanatory diagram (flowchart/ER/sequence diagram of the dataset's
    // structure) — no SQL, no rows, just the Mermaid diagram itself.
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = data.chart;
    bubble.appendChild(div);
    mermaid.run({ nodes: [div] }).then(scrollToBottom);
    sessionItems.push({ id: newId(), question: data.text, summary: '', insights: [], sql: '', columns: [], rows: [], chart: data.chart, kind: 'diagram' });
    return;
  }

  const isScalar = data.rows.length === 1 && data.columns.length === 1;
  const item = makeItem(data);
  sessionItems.push(item);
  const ctl = { text: data.summary || '', onChange: null, item };

  // A scalar already *is* the answer, shown big below — no sentence needed
  // (though its text is still there for Listen / voice replies).
  const line = answerLine(ctl, data, opts, !isScalar && data.rows.length > 0);
  if (line) bubble.appendChild(line);
  if (data.insights && data.insights.length) bubble.appendChild(insightsBlock(data.insights));
  bubble.appendChild(sqlBlock(data));
  bubble.appendChild(actionsBlock(data, ctl, item));

  if (isScalar) {
    const div = document.createElement('div');
    div.className = 'scalar';
    div.textContent = `${data.columns[0]}: ${data.rows[0][0]}`;
    bubble.appendChild(div);
    scrollToBottom();
    return;
  }

  // Bars/slices are only worth clicking when each one is a category with a number.
  data.drillable = data.columns.length === 2 && data.rows.length >= 2 && data.rows.length <= 25
    && data.rows.every(r => typeof r[1] === 'number');

  if (data.is_mermaid) bubble.appendChild(chartBlock(data, item));
  bubble.appendChild(tableBlock(data.columns, data.rows));
  scrollToBottom();
}

function insightsBlock(list) {
  const wrap = document.createElement('div');
  wrap.className = 'insights';
  const icons = { up: '▲', down: '▼', info: '●' };
  list.forEach(i => {
    const pill = document.createElement('div');
    pill.className = `insight ${i.kind}`;
    const ico = document.createElement('span');
    ico.className = 'ico';
    ico.textContent = icons[i.kind] || '●';
    const text = document.createElement('span');
    text.textContent = i.text;
    pill.append(ico, text);
    wrap.appendChild(pill);
  });
  return wrap;
}

const CHART_LABELS = { bar: 'Bar', line: 'Line', pie: 'Pie', forecast: 'Forecast' };

// Mermaid has no dashed lines and, for the forecast's shorter "history" series,
// emits NaN path data — so after drawing, trim the broken segment, color the
// history solid green and the forecast dashed gold.
function styleForecast(div) {
  const svg = div.querySelector('svg');
  if (!svg) return;
  const forecast = svg.querySelector('g.line-plot-0 path');
  const history = svg.querySelector('g.line-plot-1 path');
  if (history) {
    const parts = history.getAttribute('d').split('L');
    const firstBad = parts.findIndex(p => p.includes('NaN'));
    history.setAttribute('d', (firstBad === -1 ? parts : parts.slice(0, firstBad)).join('L'));
    history.style.stroke = '#1c3324';
    history.style.strokeWidth = '2.5';
  }
  if (forecast) {
    forecast.style.stroke = '#b6884c';
    forecast.style.strokeWidth = '2.5';
    forecast.style.strokeDasharray = '8 6';
  }
}

// Click a bar or pie slice to break that value down further.
function wireDrill(div, kind, data) {
  const svg = div.querySelector('svg');
  if (!svg || !data.drillable) return false;
  const sanitize = v => (v === null ? '(empty)' : String(v).replace(/"/g, "'").replace(/\n/g, ' '));
  const originals = new Map(data.rows.map(r => [sanitize(r[0]), r[0]]));
  const attach = (el, value) => {
    if (!el || value === null || value === undefined) return;
    el.classList.add('drillable');
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    tip.textContent = `Click to break down ${value}`;
    el.appendChild(tip);
    el.addEventListener('click', () => drillDown(data, value));
  };
  if (kind === 'bar') {
    svg.querySelectorAll('g.bar-plot-0 rect').forEach((rect, i) => attach(rect, data.rows[i] && data.rows[i][0]));
    return true;
  }
  if (kind === 'pie') {
    const slices = svg.querySelectorAll('.pieCircle');
    svg.querySelectorAll('.legend text').forEach((label, i) => {
      const value = originals.get(label.textContent);
      attach(slices[i], value);
      attach(label, value);
    });
    return true;
  }
  return false;
}

function drillDown(data, value) {
  sendMessage(`Break down “${value}” further`, false, undefined, undefined,
    { drill: { column: data.columns[0], value: String(value) } });
}

// The chart, with a Bar/Line/Pie/Forecast switcher when more than one type suits the data.
function chartBlock(data, item) {
  const charts = Object.keys(data.charts || {}).length ? data.charts : { chart: data.chart };
  const kinds = Object.keys(charts);
  const wrap = document.createElement('div');
  const holder = document.createElement('div');
  const note = document.createElement('div');
  note.className = 'chart-note';

  const draw = (kind) => {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = charts[kind];
    holder.replaceChildren(div);
    if (item) { item.chart = charts[kind]; item.kind = kind; } // pins/reports keep the view that was showing
    note.textContent = '';
    mermaid.run({ nodes: [div] })
      .then(() => {
        if (kind === 'forecast') {
          styleForecast(div);
          const fc = data.forecast;
          note.textContent = `Solid: actual · dashed: forecast (${fc.labels.map((l, i) => `${l}: ${fc.values[i].toLocaleString()}`).join(' · ')})`;
        } else if (wireDrill(div, kind, data)) {
          note.textContent = kind === 'pie' ? 'Click a slice to break it down further' : 'Click a bar to break it down further';
        }
        scrollToBottom();
      })
      .catch(() => { holder.textContent = `Couldn't draw this as a ${CHART_LABELS[kind] || 'chart'} chart.`; });
  };

  if (kinds.length > 1) {
    const toggle = document.createElement('div');
    toggle.className = 'chart-toggle';
    kinds.forEach(kind => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'seg' + (kind === data.chart_kind ? ' active' : '');
      btn.textContent = CHART_LABELS[kind] || kind;
      btn.addEventListener('click', () => {
        toggle.querySelectorAll('.seg').forEach(b => b.classList.toggle('active', b === btn));
        draw(kind);
      });
      toggle.appendChild(btn);
    });
    wrap.appendChild(toggle);
  }
  wrap.append(holder, note);
  draw(data.chart_kind in charts ? data.chart_kind : kinds[0]);
  return wrap;
}

function sqlBlock(data) {
  const div = document.createElement('div');
  div.className = 'sql';
  div.textContent = `${data.source}: ${data.sql}`;
  return div;
}

function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function toCsv(columns, rows) {
  const lines = [columns.map(csvEscape).join(',')];
  rows.forEach(row => lines.push(row.map(csvEscape).join(',')));
  return lines.join('\n');
}

function downloadCsv(columns, rows) {
  const blob = new Blob([toCsv(columns, rows)], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `query-results-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function actionsBlock(data, ctl, item) {
  const wrap = document.createElement('div');
  wrap.className = 'result-actions';

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'action-btn';
  copyBtn.innerHTML = `${copyIcon()}<span>Copy SQL</span>`;
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(data.sql);
      copyBtn.querySelector('span').textContent = 'Copied!';
      setTimeout(() => { copyBtn.querySelector('span').textContent = 'Copy SQL'; }, 1500);
    } catch { /* clipboard unavailable — ignore */ }
  });
  wrap.appendChild(copyBtn);

  if (data.rows.length) {
    const csvBtn = document.createElement('button');
    csvBtn.type = 'button';
    csvBtn.className = 'action-btn';
    csvBtn.innerHTML = `${downloadIcon()}<span>Download CSV</span>`;
    csvBtn.addEventListener('click', () => downloadCsv(data.columns, data.rows));
    wrap.appendChild(csvBtn);
  }

  const explainBtn = document.createElement('button');
  explainBtn.type = 'button';
  explainBtn.className = 'action-btn';
  explainBtn.innerHTML = `${explainIcon()}<span>Explain</span>`;
  explainBtn.addEventListener('click', async () => {
    const existing = wrap.parentElement.querySelector('.explanation');
    if (existing) { existing.remove(); return; }
    explainBtn.querySelector('span').textContent = 'Explaining...';
    explainBtn.disabled = true;
    let message;
    try {
      const resp = await fetch('/explain-sql', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sql: data.sql, text: data.text || '', tables: data.tables || ['sales'] }),
      });
      const result = await resp.json();
      message = resp.ok ? result.explanation : (result.detail || `Request failed (${resp.status}).`);
    } catch (err) {
      message = `Couldn't reach the server: ${err.message || err}`;
    }
    explainBtn.querySelector('span').textContent = 'Explain';
    explainBtn.disabled = false;
    const div = document.createElement('div');
    div.className = 'explanation';
    div.textContent = message;
    wrap.insertAdjacentElement('afterend', div);
    scrollToBottom();
  });
  wrap.appendChild(explainBtn);

  const editBtn = document.createElement('button');
  editBtn.type = 'button';
  editBtn.className = 'action-btn';
  editBtn.innerHTML = `${editIcon()}<span>Edit SQL</span>`;
  editBtn.addEventListener('click', () => openSqlEditor(wrap, data));
  wrap.appendChild(editBtn);

  const pinBtn = document.createElement('button');
  pinBtn.type = 'button';
  pinBtn.className = 'action-btn';
  const paintPin = () => { pinBtn.innerHTML = `${pinIcon()}<span>${isPinned(item) ? 'Pinned' : 'Pin'}</span>`; };
  paintPin();
  pinBtn.addEventListener('click', () => { togglePin(item); paintPin(); });
  wrap.appendChild(pinBtn);

  if (canSpeak) {
    const listenBtn = document.createElement('button');
    listenBtn.type = 'button';
    listenBtn.className = 'action-btn';
    listenBtn.innerHTML = `${listenIcon()}<span>Listen</span>`;
    listenBtn.disabled = !ctl.text; // enabled once the sentence has arrived
    ctl.onChange = () => { listenBtn.disabled = !ctl.text; };
    listenBtn.addEventListener('click', () => {
      if (listenBtn.dataset.speaking) speechSynthesis.cancel();
      else speakText(ctl.text, listenBtn);
    });
    wrap.appendChild(listenBtn);
  }

  return wrap;
}

// Display only: long floats (35.78947368421053) are noise in a table. The CSV
// download uses the raw values.
function displayCell(v) {
  if (v === null) return '';
  if (typeof v === 'number' && !Number.isInteger(v)) return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
  return v;
}

function tableBlock(columns, rows) {
  const wrap = document.createElement('div');
  if (!rows.length) {
    wrap.textContent = 'No rows.';
    return wrap;
  }
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  const thead = document.createElement('tr');
  columns.forEach(c => { const th = document.createElement('th'); th.textContent = c; thead.appendChild(th); });
  table.appendChild(thead);
  rows.slice(0, 200).forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(v => { const td = document.createElement('td'); td.textContent = displayCell(v); tr.appendChild(td); });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}
</script>
</body>
</html>
