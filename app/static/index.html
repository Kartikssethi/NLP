<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice-to-SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f2ede0;
    --panel: #faf7ee;
    --bubble-user: #1c3324;
    --bubble-assistant: #ffffff;
    --ink: #1a2a1d;
    --ink-soft: #5b6b56;
    --accent: #1c3324;
    --accent-hover: #142419;
    --gold: #b6884c;
    --gold-soft: #e4d3ab;
    --border: #e2dbc4;
    --danger: #9c3b2e;
    --danger-soft: #f3e2dd;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .app {
    display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto;
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 18px 24px 14px; flex-shrink: 0;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--gold); font-weight: 600;
  }
  .brand h1 { font-family: "Playfair Display", serif; font-weight: 700; font-size: 1.3rem; margin: 0; }
  #newChatBtn {
    font-size: 0.8rem; font-weight: 500; color: var(--ink-soft);
    background: none; border: 1px solid var(--border); padding: 7px 13px;
    border-radius: 9px; cursor: pointer; font-family: "Inter", sans-serif;
  }
  #newChatBtn:hover { background: #ece5d2; color: var(--ink); }

  /* ---- scrollable chat ---- */
  #chat { flex: 1; overflow-y: auto; padding: 8px 24px 16px; }

  .welcome { padding: 40px 12px 24px; }
  .welcome .subtitle {
    font-family: "Playfair Display", serif; font-style: italic; font-weight: 500;
    color: var(--ink-soft); font-size: 1.25rem; margin: 0 0 22px;
  }
  #examples { color: var(--ink-soft); font-size: 0.83rem; line-height: 1.8; }
  #examples code {
    background: var(--gold-soft); color: #5a4322; padding: 3px 9px; border-radius: 7px; cursor: pointer;
    font-size: 0.79rem; font-family: "Inter", sans-serif; transition: background 0.15s;
  }
  #examples code:hover { background: #d8c393; }

  .msg { display: flex; margin-bottom: 16px; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble { max-width: 88%; border-radius: 16px; padding: 12px 16px; }
  .msg.user .bubble {
    background: var(--bubble-user); color: #f4efe1; border-bottom-right-radius: 4px;
    font-size: 0.96rem;
  }
  .msg.assistant .bubble {
    background: var(--bubble-assistant); border: 1px solid var(--border);
    border-bottom-left-radius: 4px; width: 100%;
    box-shadow: 0 1px 2px rgba(26,42,29,0.03);
  }

  .thinking { display: flex; gap: 4px; padding: 4px 2px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .sql {
    background: #16241a; color: #cfe0c9; padding: 11px 14px;
    border-radius: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; margin-bottom: 10px;
  }
  .status-line { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 8px; }
  .scalar { font-family: "Playfair Display", serif; font-size: 1.6rem; font-weight: 600; padding: 6px 0; }
  .error-box { color: var(--danger); background: var(--danger-soft); padding: 11px 14px; border-radius: 10px; }

  .confirm-box {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f6ecd6; border: 1px solid var(--gold-soft); padding: 11px 14px;
    border-radius: 10px; margin-top: 10px; font-size: 0.88rem;
  }

  .table-scroll { max-width: 100%; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.81rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; white-space: nowrap; }
  th { background: #efe9d8; font-weight: 600; font-family: "Inter", sans-serif; }
  tr:nth-child(even) td { background: #f8f4e8; }

  /* ---- composer ---- */
  .composer-wrap { flex-shrink: 0; padding: 12px 24px 20px; background: var(--bg); }
  #recordingBar {
    display: none; flex-direction: column; gap: 6px;
    margin-bottom: 10px; padding: 12px 15px;
    background: var(--danger-soft); border: 1px solid #e6bdb1; border-radius: 12px;
  }
  #recordingBar.active { display: flex; }
  .recordingHead { display: flex; align-items: center; gap: 10px; font-size: 0.83rem; color: var(--danger); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  #liveCaption {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 1rem;
    color: #6b2f24; min-height: 1.3em;
  }

  #queryForm {
    display: flex; gap: 8px; background: #fff; border: 1px solid var(--border);
    border-radius: 16px; padding: 6px 6px 6px 16px; box-shadow: 0 1px 2px rgba(26,42,29,0.04), 0 8px 20px rgba(26,42,29,0.05);
  }
  #text {
    flex: 1; border: none; outline: none; font-size: 1rem; font-family: "Inter", sans-serif;
    background: transparent; color: var(--ink); padding: 10px 0;
  }
  #text::placeholder { color: #9aa596; }

  button {
    border: none; border-radius: 11px; cursor: pointer;
    font-weight: 600; font-family: "Inter", sans-serif; transition: background 0.15s;
  }
  #sendBtn {
    padding: 11px 20px; font-size: 0.95rem; background: var(--accent); color: var(--panel); flex-shrink: 0;
  }
  #sendBtn:hover { background: var(--accent-hover); }
  .secondary { padding: 9px 16px; font-size: 0.85rem; background: #ece5d2; color: var(--ink); }
  .secondary:hover { background: #e2d9c0; }
  .danger { padding: 9px 16px; font-size: 0.85rem; background: var(--danger); color: #fff; }
  .danger:hover { background: #7f2f24; }

  #micBtn {
    background: transparent; color: var(--ink-soft); border: none;
    padding: 10px 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #micBtn:hover { background: #ece5d2; border-radius: 10px; }
  #micBtn.recording { color: var(--danger); }

  @media (max-width: 480px) {
    header { padding: 14px 14px 10px; }
    .brand h1 { font-size: 1.05rem; }
    #newChatBtn { font-size: 0.75rem; padding: 6px 10px; }
    #chat { padding: 4px 14px 12px; }
    .composer-wrap { padding: 10px 14px 16px; }
    #queryForm { padding: 4px 4px 4px 12px; }
    #sendBtn { padding: 10px 14px; }
    .bubble { max-width: 96%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="eyebrow">Sales data</span>
      <h1>Voice-to-SQL</h1>
    </div>
    <button type="button" id="newChatBtn">New chat</button>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <p class="subtitle">Type it, or just say it — I'll turn it into a query.</p>
      <div id="examples">
        Try: <code>top 5 brands by quantity sold</code> ·
        <code>how many laptops in west region</code> ·
        <code>average price of samsung phones</code> ·
        <code>delete 2 laptops in central region</code>
      </div>
    </div>
    <div id="messages"></div>
  </div>

  <div class="composer-wrap">
    <div id="recordingBar">
      <div class="recordingHead">
        <div class="dot"></div>
        <span>Listening — <span id="timer">0:30</span></span>
      </div>
      <div id="liveCaption">Say something...</div>
    </div>

    <form id="queryForm">
      <input id="text" type="text" placeholder="Ask something about the sales data..." autocomplete="off" autofocus />
      <button type="button" id="micBtn" title="Record a question">
        <svg id="micIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>
        <svg id="stopIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button type="submit" id="sendBtn">Ask</button>
    </form>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: false });

const chatEl = document.getElementById('chat');
const welcomeEl = document.getElementById('welcome');
const messagesEl = document.getElementById('messages');
const newChatBtn = document.getElementById('newChatBtn');

const form = document.getElementById('queryForm');
const textInput = document.getElementById('text');
const micBtn = document.getElementById('micBtn');
const micIcon = document.getElementById('micIcon');
const stopIcon = document.getElementById('stopIcon');
const recordingBar = document.getElementById('recordingBar');
const timerEl = document.getElementById('timer');
const liveCaptionEl = document.getElementById('liveCaption');

const RECORD_SECONDS = 30;
const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

let countdownInterval = null;
let autoStopTimeout = null;

// Conversation memory for this page session — lets a follow-up like "now
// break that down by region" resolve "that" against what was already asked.
// Sent to the server with every /query call; only the Ollama fallback uses
// it (see nl2sql.py). Cleared on page reload or via "New chat".
let conversationHistory = [];

// --- Speech-to-text primary path: the browser's own free recognizer ------
let recognition = null;
let finalTranscript = '';
let shouldContinueListening = false;

// --- Fallback path (Safari/Firefox): record audio, POST to /transcribe ---
let mediaRecorder = null;
let recordedChunks = [];

document.querySelectorAll('#examples code').forEach(el => {
  el.addEventListener('click', () => { textInput.value = el.textContent; form.requestSubmit(); });
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = textInput.value;
  textInput.value = '';
  sendMessage(text, false);
});

newChatBtn.addEventListener('click', () => {
  conversationHistory = [];
  messagesEl.innerHTML = '';
  welcomeEl.style.display = '';
});

micBtn.addEventListener('click', () => {
  const isRecording = (recognition && shouldContinueListening) || (mediaRecorder && mediaRecorder.state === 'recording');
  if (isRecording) {
    stopRecording();
  } else if (SpeechRecognitionCtor) {
    startSpeechRecognition();
  } else {
    startMediaRecorderFallback();
  }
});

// --- Chat rendering --------------------------------------------------------

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function addUserMessage(text) {
  welcomeEl.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
}

function addAssistantMessage() {
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  msg.appendChild(bubble);
  messagesEl.appendChild(msg);
  scrollToBottom();
  return bubble;
}

// --- Recording UI ------------------------------------------------------

function beginRecordingUI() {
  micBtn.classList.add('recording');
  micIcon.style.display = 'none';
  stopIcon.style.display = '';
  recordingBar.classList.add('active');
  liveCaptionEl.textContent = 'Say something...';
  startCountdown();
}

function endRecordingUI() {
  micBtn.classList.remove('recording');
  micIcon.style.display = '';
  stopIcon.style.display = 'none';
  recordingBar.classList.remove('active');
  clearInterval(countdownInterval);
  clearTimeout(autoStopTimeout);
}

function startCountdown() {
  let remaining = RECORD_SECONDS;
  timerEl.textContent = `0:${String(remaining).padStart(2, '0')}`;
  countdownInterval = setInterval(() => {
    remaining -= 1;
    timerEl.textContent = `0:${String(Math.max(remaining, 0)).padStart(2, '0')}`;
    if (remaining <= 0) clearInterval(countdownInterval);
  }, 1000);
  autoStopTimeout = setTimeout(() => stopRecording(), RECORD_SECONDS * 1000);
}

function stopRecording() {
  shouldContinueListening = false;
  if (recognition) recognition.stop(); // -> onend finalizes and sends the message
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

// --- Primary: Web Speech API ---------------------------------------------

function startSpeechRecognition() {
  finalTranscript = '';
  textInput.value = ''; // clear stale text so a failed/empty recording can't resend old text
  shouldContinueListening = true;
  recognition = new SpeechRecognitionCtor();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';

  recognition.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const chunk = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalTranscript += chunk + ' ';
      else interim += chunk;
    }
    const live = (finalTranscript + interim).trim();
    liveCaptionEl.textContent = live || 'Say something...';
    textInput.value = live;
  };

  let fatalMicError = false;

  recognition.onerror = (event) => {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      fatalMicError = true;
      shouldContinueListening = false;
      endRecordingUI();
      liveCaptionEl.textContent = '';
      addAssistantMessage().innerHTML = '<div class="error-box">Couldn\'t access the microphone: permission denied.</div>';
    }
    // other errors (e.g. transient 'no-speech') are non-fatal; onend handles restart/finalize
  };

  recognition.onend = () => {
    if (shouldContinueListening) {
      try { recognition.start(); } catch { /* already starting */ }
      return;
    }
    if (fatalMicError) return; // onerror already reported this
    endRecordingUI();
    const text = finalTranscript.trim() || textInput.value.trim();
    textInput.value = '';
    if (text) sendMessage(text, false);
  };

  try {
    recognition.start();
    beginRecordingUI();
  } catch {
    addAssistantMessage().innerHTML = '<div class="error-box">Could not start the microphone.</div>';
  }
}

// --- Fallback: record + server-side faster-whisper transcription --------

async function startMediaRecorderFallback() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    addAssistantMessage().innerHTML = `<div class="error-box">Couldn't access the microphone: ${err.message || err}</div>`;
    return;
  }

  liveCaptionEl.textContent = '(live captions need Chrome or Edge — recording still works)';
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    endRecordingUI();
    await sendRecordingForTranscription(new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' }));
  };
  mediaRecorder.start();
  beginRecordingUI();
}

async function sendRecordingForTranscription(blob) {
  const bubble = addAssistantMessage();
  bubble.innerHTML = '<div class="status-line">Transcribing...</div>';
  const form = new FormData();
  const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
  form.append('file', blob, `recording.${ext}`);

  let resp, data;
  try {
    resp = await fetch('/transcribe', { method: 'POST', body: form });
    data = await resp.json();
  } catch (err) {
    bubble.innerHTML = `<div class="error-box">Transcription request failed: ${err}</div>`;
    return;
  }
  if (!resp.ok) {
    bubble.innerHTML = `<div class="error-box">${(data && data.detail) || 'Transcription failed.'}</div>`;
    return;
  }

  bubble.parentElement.remove(); // was just a "transcribing..." placeholder — the real turn starts now
  sendMessage(data.text, false);
}

// --- Query execution -------------------------------------------------------

async function sendMessage(text, confirm, existingBubble, forUserText) {
  if (!text.trim()) return;

  let bubble;
  if (existingBubble) {
    bubble = existingBubble;
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  } else {
    addUserMessage(text);
    bubble = addAssistantMessage();
  }

  let resp, data;
  try {
    resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: forUserText || text, confirm, history: conversationHistory }),
    });
    data = await resp.json();
  } catch (err) {
    bubble.innerHTML = `<div class="error-box">Request failed: ${err}</div>`;
    return;
  }

  if (!resp.ok) {
    bubble.innerHTML = `<div class="error-box">${(data && data.detail) || resp.statusText}</div>`;
    return;
  }

  if (data.requires_confirmation) {
    renderConfirm(bubble, data, forUserText || text);
    return;
  }

  renderResult(bubble, data);

  conversationHistory.push({ text: forUserText || text, sql: data.sql });
  conversationHistory = conversationHistory.slice(-5);
}

function renderConfirm(bubble, data, originalText) {
  bubble.innerHTML = '';
  bubble.appendChild(sqlBlock(data));
  bubble.appendChild(tableBlock(data.columns, data.rows));

  const box = document.createElement('div');
  box.className = 'confirm-box';
  const label = document.createElement('span');
  label.textContent = `This will affect ${data.rows.length} row(s). Run it?`;
  const yesBtn = document.createElement('button');
  yesBtn.textContent = 'Yes, run it';
  yesBtn.addEventListener('click', () => sendMessage(originalText, true, bubble, originalText));
  const noBtn = document.createElement('button');
  noBtn.className = 'secondary';
  noBtn.textContent = 'Cancel';
  noBtn.addEventListener('click', () => {
    box.remove();
    const note = document.createElement('div');
    note.className = 'status-line';
    note.textContent = 'Cancelled.';
    bubble.appendChild(note);
  });
  box.append(label, yesBtn, noBtn);
  bubble.appendChild(box);
  scrollToBottom();
}

function renderResult(bubble, data) {
  bubble.innerHTML = '';
  bubble.appendChild(sqlBlock(data));

  if (data.rows.length === 1 && data.columns.length === 1) {
    const div = document.createElement('div');
    div.className = 'scalar';
    div.textContent = `${data.columns[0]}: ${data.rows[0][0]}`;
    bubble.appendChild(div);
    scrollToBottom();
    return;
  }

  if (data.is_mermaid) {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = data.chart;
    bubble.appendChild(div);
    mermaid.run({ nodes: [div] }).then(scrollToBottom);
  }
  bubble.appendChild(tableBlock(data.columns, data.rows));
  scrollToBottom();
}

function sqlBlock(data) {
  const div = document.createElement('div');
  div.className = 'sql';
  div.textContent = `${data.source}: ${data.sql}`;
  return div;
}

function tableBlock(columns, rows) {
  const wrap = document.createElement('div');
  if (!rows.length) {
    wrap.textContent = 'No rows.';
    return wrap;
  }
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  const thead = document.createElement('tr');
  columns.forEach(c => { const th = document.createElement('th'); th.textContent = c; thead.appendChild(th); });
  table.appendChild(thead);
  rows.slice(0, 200).forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(v => { const td = document.createElement('td'); td.textContent = v === null ? '' : v; tr.appendChild(td); });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}
</script>
</body>
</html>
