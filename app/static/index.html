<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice-to-SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
  :root {
    --bg: #f2ede0;
    --panel: #faf7ee;
    --bubble-user: #1c1c1c;
    --bubble-assistant: #ffffff;
    --ink: #1a2a1d;
    --ink-soft: #5b6b56;
    --accent: #1c3324;
    --accent-hover: #142419;
    --gold: #b6884c;
    --gold-soft: #e4d3ab;
    --border: #e2dbc4;
    --danger: #9c3b2e;
    --danger-soft: #f3e2dd;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  .app {
    display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto;
    background: var(--bg);
  }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 24px; flex-shrink: 0; gap: 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 1px 0 rgba(26,42,29,0.02), 0 4px 14px rgba(26,42,29,0.04);
    position: relative; z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .logo-mark {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(155deg, #24402c, #16241a);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .brand-text { min-width: 0; }
  .brand h1 {
    font-family: "Playfair Display", serif; font-weight: 700; font-size: 1.18rem;
    margin: 0; line-height: 1.15; letter-spacing: -0.01em;
  }
  #datasetLabel {
    font-size: 0.74rem; color: var(--ink-soft); display: flex; align-items: center; gap: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #datasetLabel .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; animation: none; }

  .header-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: transparent;
    border: 1px solid transparent; color: var(--ink-soft);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: #ece5d2; color: var(--ink); }

  /* ---- scrollable chat ---- */
  #chat { flex: 1; overflow-y: auto; padding: 20px 24px 16px; }

  .welcome { padding: 40px 12px 24px; }
  .welcome .subtitle {
    font-family: "Playfair Display", serif; font-style: italic; font-weight: 500;
    color: var(--ink-soft); font-size: 1.25rem; margin: 0 0 22px;
  }
  #examples { color: var(--ink-soft); font-size: 0.83rem; line-height: 1.8; }
  #examples code {
    background: var(--gold-soft); color: #5a4322; padding: 3px 9px; border-radius: 7px; cursor: pointer;
    font-size: 0.79rem; font-family: "Inter", sans-serif; transition: background 0.15s;
  }
  #examples code:hover { background: #d8c393; }

  .msg-row { display: flex; gap: 10px; margin-bottom: 20px; align-items: flex-start; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 2px;
  }
  .avatar.assistant-avatar { background: linear-gradient(155deg, #24402c, #16241a); }
  .avatar.user-avatar { background: var(--gold-soft); color: #5a4322; }

  .msg { display: flex; flex-direction: column; min-width: 0; }
  .msg.user { align-items: flex-end; flex: 0 1 auto; max-width: 82%; }
  .msg.assistant { align-items: flex-start; flex: 1 1 auto; min-width: 0; }
  .msg-meta {
    display: flex; align-items: center; gap: 6px; font-size: 0.74rem;
    color: var(--ink-soft); margin-bottom: 5px; padding: 0 4px;
  }
  .msg-meta .who { font-weight: 600; color: var(--ink); }
  .msg-meta .check { color: var(--gold); }
  .bubble { max-width: 100%; border-radius: 18px; padding: 12px 16px; }
  .msg.user .bubble { background: var(--bubble-user); color: #f5f2ea; font-size: 0.96rem; }
  .msg.assistant .bubble {
    background: var(--bubble-assistant); border: 1px solid var(--border);
    width: 100%; box-shadow: 0 1px 2px rgba(26,42,29,0.03);
  }

  .thinking { display: flex; gap: 4px; padding: 4px 2px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: bounce 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.15s; }
  .thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }

  .sql {
    background: #16241a; color: #cfe0c9; padding: 11px 14px;
    border-radius: 10px; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem; overflow-x: auto; white-space: pre-wrap; margin-bottom: 10px;
  }
  .status-line { color: var(--ink-soft); font-size: 0.8rem; margin-bottom: 8px; }
  .scalar { font-family: "Playfair Display", serif; font-size: 1.6rem; font-weight: 600; padding: 6px 0; }
  .error-box { color: var(--danger); background: var(--danger-soft); padding: 11px 14px; border-radius: 10px; }
  .system-note {
    align-self: center; color: var(--ink-soft); font-size: 0.78rem;
    background: #ece5d2; padding: 6px 14px; border-radius: 20px; margin-bottom: 18px;
  }

  .confirm-box {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: #f6ecd6; border: 1px solid var(--gold-soft); padding: 11px 14px;
    border-radius: 10px; margin-top: 10px; font-size: 0.88rem;
  }

  .table-scroll { max-width: 100%; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.81rem; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; white-space: nowrap; }
  th { background: #efe9d8; font-weight: 600; font-family: "Inter", sans-serif; }
  tr:nth-child(even) td { background: #f8f4e8; }

  /* ---- composer ---- */
  .composer-wrap { flex-shrink: 0; padding: 10px 24px 20px; background: var(--bg); }

  .toolbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .pill-btn {
    display: flex; align-items: center; gap: 5px;
    background: transparent; border: none; color: var(--ink-soft);
    padding: 5px 10px; border-radius: 20px; cursor: pointer;
    font-size: 0.74rem; font-weight: 500; font-family: "Inter", sans-serif;
  }
  .pill-btn:hover { background: #ece5d2; color: var(--ink); }
  .pill-btn svg { flex-shrink: 0; }

  #recordingBar {
    display: none; flex-direction: column; gap: 6px;
    margin-bottom: 10px; padding: 12px 15px;
    background: var(--danger-soft); border: 1px solid #e6bdb1; border-radius: 12px;
  }
  #recordingBar.active { display: flex; }
  .recordingHead { display: flex; align-items: center; gap: 10px; font-size: 0.83rem; color: var(--danger); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); animation: pulse 1s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  #timer { font-variant-numeric: tabular-nums; font-weight: 700; }
  #liveCaption {
    font-family: "Playfair Display", serif; font-style: italic; font-size: 1rem;
    color: #6b2f24; min-height: 1.3em;
  }

  #queryForm {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border);
    border-radius: 26px; padding: 6px 6px 6px 18px; box-shadow: 0 1px 2px rgba(26,42,29,0.04), 0 8px 20px rgba(26,42,29,0.05);
  }
  #text {
    flex: 1; border: none; outline: none; font-size: 1rem; font-family: "Inter", sans-serif;
    background: transparent; color: var(--ink); padding: 10px 0;
  }
  #text::placeholder { color: #9aa596; }

  button { border: none; cursor: pointer; font-family: "Inter", sans-serif; transition: background 0.15s; }

  #sendBtn {
    width: 42px; height: 42px; border-radius: 50%; background: #111; color: #fff;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #sendBtn:hover { background: #000; }
  #sendBtn svg { margin-left: -1px; }

  .secondary { padding: 9px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 11px; background: #ece5d2; color: var(--ink); }
  .secondary:hover { background: #e2d9c0; }
  .primary { padding: 9px 16px; font-size: 0.85rem; font-weight: 600; border-radius: 11px; background: var(--accent); color: var(--panel); }
  .primary:hover { background: var(--accent-hover); }

  #micBtn {
    background: transparent; color: var(--ink-soft); border-radius: 50%;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  #micBtn:hover { background: #ece5d2; }
  #micBtn.recording { color: var(--danger); }

  @media (max-width: 480px) {
    header { padding: 12px 14px; }
    .brand h1 { font-size: 1.02rem; }
    .logo-mark { width: 32px; height: 32px; }
    #chat { padding: 14px 14px 12px; }
    .composer-wrap { padding: 8px 14px 16px; }
    #queryForm { padding: 4px 4px 4px 14px; }
    .msg.user { max-width: 90%; }
    .avatar { width: 26px; height: 26px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo-mark">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#e8dfc8" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19v-6"/></svg>
      </div>
      <div class="brand-text">
        <h1>Voice-to-SQL</h1>
        <div id="datasetLabel"><span class="dot"></span><span id="datasetLabelText">Sales data</span></div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" id="newChatBtn" title="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <div id="chat">
    <div class="welcome" id="welcome">
      <p class="subtitle">Type it, or just say it — I'll turn it into a query.</p>
      <div id="examples">
        Try: <code>top 5 brands by quantity sold</code> ·
        <code>how many laptops in west region</code> ·
        <code>average price of samsung phones</code> ·
        <code>delete 2 laptops in central region</code>
      </div>
    </div>
    <div id="messages"></div>
  </div>

  <div class="composer-wrap">
    <div class="toolbar">
      <input type="file" id="csvInput" accept=".csv" style="display:none" />
      <button type="button" class="pill-btn" id="uploadBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Upload dataset
      </button>
      <button type="button" class="pill-btn" id="sampleBtn" style="display:none">Use sample data</button>
    </div>

    <div id="recordingBar">
      <div class="recordingHead">
        <div class="dot"></div>
        <span>Listening — <span id="timer">0:30</span></span>
      </div>
      <div id="liveCaption">Say something...</div>
    </div>

    <form id="queryForm">
      <input id="text" type="text" placeholder="Ask something about the data..." autocomplete="off" autofocus />
      <button type="button" id="micBtn" title="Record a question">
        <svg id="micIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>
        <svg id="stopIcon" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button type="submit" id="sendBtn" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.6l17.5-8.4a1 1 0 0 0 0-1.8L3.4 1.9a1 1 0 0 0-1.4 1.1L4 11 2 20a1 1 0 0 0 1.4 1.1z"/></svg>
      </button>
    </form>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: false });

const chatEl = document.getElementById('chat');
const welcomeEl = document.getElementById('welcome');
const messagesEl = document.getElementById('messages');
const newChatBtn = document.getElementById('newChatBtn');
const datasetLabelText = document.getElementById('datasetLabelText');

const form = document.getElementById('queryForm');
const textInput = document.getElementById('text');
const micBtn = document.getElementById('micBtn');
const micIcon = document.getElementById('micIcon');
const stopIcon = document.getElementById('stopIcon');
const recordingBar = document.getElementById('recordingBar');
const timerEl = document.getElementById('timer');
const liveCaptionEl = document.getElementById('liveCaption');

const csvInput = document.getElementById('csvInput');
const uploadBtn = document.getElementById('uploadBtn');
const sampleBtn = document.getElementById('sampleBtn');

const RECORD_SECONDS = 30;
const LIVE_TRANSCRIBE_INTERVAL_MS = 3000;

let countdownInterval = null;
let autoStopTimeout = null;

// Conversation memory for this page session — lets a follow-up like "now
// break that down by region" resolve "that" against what was already asked.
// Sent to the server with every /query call; only the Ollama fallback uses
// it (see nl2sql.py). Cleared on page reload or via "New chat".
let conversationHistory = [];

// Which table /query runs against — "sales" (built-in) until a CSV is
// uploaded, then "user_data". See app/db.py::UPLOADED_TABLE.
let activeTable = 'sales';

// --- Voice input: faster-whisper, with periodic re-transcription while
// recording so the input updates "live" as you talk, not just at the end.
let mediaRecorder = null;
let recordedChunks = [];
let liveTranscribeTimer = null;
let transcribing = false;
let recording = false;
let lastTranscript = ''; // last successful transcription this recording, used as a
                          // fallback if the final call lands while a periodic one is in-flight

document.querySelectorAll('#examples code').forEach(el => {
  el.addEventListener('click', () => { textInput.value = el.textContent; form.requestSubmit(); });
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = textInput.value;
  textInput.value = '';
  sendMessage(text, false);
});

newChatBtn.addEventListener('click', () => {
  conversationHistory = [];
  messagesEl.innerHTML = '';
  welcomeEl.style.display = '';
});

micBtn.addEventListener('click', () => {
  if (recording) stopRecording();
  else startRecording();
});

// --- Dataset upload --------------------------------------------------------

uploadBtn.addEventListener('click', () => csvInput.click());

csvInput.addEventListener('change', async () => {
  const file = csvInput.files[0];
  csvInput.value = '';
  if (!file) return;

  addSystemNote(`Loading ${file.name}...`);
  const form = new FormData();
  form.append('file', file);

  let resp, data;
  try {
    resp = await fetch('/upload-dataset', { method: 'POST', body: form });
    data = await resp.json();
  } catch (err) {
    addSystemNote(`Upload failed: ${err}`);
    return;
  }
  if (!resp.ok) {
    addSystemNote((data && data.detail) || 'Upload failed.');
    return;
  }

  activeTable = data.table;
  conversationHistory = []; // new dataset — old follow-up context no longer applies
  datasetLabelText.textContent = `${data.filename} · ${data.row_count} rows`;
  sampleBtn.style.display = '';
  addSystemNote(`Loaded ${data.filename} — ${data.row_count} rows, columns: ${data.columns.join(', ')}`);
});

sampleBtn.addEventListener('click', async () => {
  await fetch('/use-sample-dataset', { method: 'POST' });
  activeTable = 'sales';
  conversationHistory = [];
  datasetLabelText.textContent = 'Sales data';
  sampleBtn.style.display = 'none';
  addSystemNote('Switched back to the sample sales dataset.');
});

function addSystemNote(text) {
  welcomeEl.style.display = 'none';
  const note = document.createElement('div');
  note.className = 'system-note';
  note.textContent = text;
  messagesEl.appendChild(note);
  scrollToBottom();
}

// --- Chat rendering --------------------------------------------------------

function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

function formatTime() {
  return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

function checkmarkIcon() {
  return '<svg class="check" width="14" height="10" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5.5L4.5 9L11 1.5"/><path d="M5.5 5.5L9 9L15.5 1.5"/></svg>';
}

function userAvatar() {
  const div = document.createElement('div');
  div.className = 'avatar user-avatar';
  div.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5z"/></svg>';
  return div;
}

function assistantAvatar() {
  const div = document.createElement('div');
  div.className = 'avatar assistant-avatar';
  div.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8dfc8" stroke-width="2.4" stroke-linecap="round"><path d="M4 19V10"/><path d="M12 19V5"/><path d="M20 19v-6"/></svg>';
  return div;
}

function addUserMessage(text) {
  welcomeEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row user';
  const msg = document.createElement('div');
  msg.className = 'msg user';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="who">You</span>${checkmarkIcon()}<span>${formatTime()}</span>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.append(meta, bubble);
  row.append(userAvatar(), msg);
  messagesEl.appendChild(row);
  scrollToBottom();
}

function addAssistantMessage() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = `<span class="who">Assistant</span><span>${formatTime()}</span>`;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  msg.append(meta, bubble);
  row.append(assistantAvatar(), msg);
  messagesEl.appendChild(row);
  scrollToBottom();
  return bubble;
}

// --- Recording UI ------------------------------------------------------

function beginRecordingUI() {
  recording = true;
  micBtn.classList.add('recording');
  micIcon.style.display = 'none';
  stopIcon.style.display = '';
  recordingBar.classList.add('active');
  liveCaptionEl.textContent = 'Say something...';
  startCountdown();
}

function endRecordingUI() {
  recording = false;
  micBtn.classList.remove('recording');
  micIcon.style.display = '';
  stopIcon.style.display = 'none';
  recordingBar.classList.remove('active');
  clearInterval(countdownInterval);
  clearTimeout(autoStopTimeout);
  clearInterval(liveTranscribeTimer);
}

function startCountdown() {
  let remaining = RECORD_SECONDS;
  timerEl.textContent = `0:${String(remaining).padStart(2, '0')}`;
  countdownInterval = setInterval(() => {
    remaining -= 1;
    timerEl.textContent = `0:${String(Math.max(remaining, 0)).padStart(2, '0')}`;
    if (remaining <= 0) clearInterval(countdownInterval);
  }, 1000);
  autoStopTimeout = setTimeout(() => stopRecording(), RECORD_SECONDS * 1000);
}

// --- Voice input: faster-whisper, periodically re-transcribing the
// in-progress recording so the caption updates "live" as you talk, then a
// final transcribe of the complete clip once you stop.

async function startRecording() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    addAssistantMessage().innerHTML = `<div class="error-box">Couldn't access the microphone: ${err.message || err}</div>`;
    return;
  }

  recordedChunks = [];
  lastTranscript = '';
  textInput.value = ''; // clear stale text so a failed/empty recording can't resend old text
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    clearInterval(liveTranscribeTimer);
    // If a periodic call is mid-flight right as we stop, wait for it rather
    // than skipping straight to a (possibly redundant) final transcription.
    while (transcribing) await new Promise(r => setTimeout(r, 100));
    const finalText = (await transcribeCurrentRecording(/* isFinal */ true)) || lastTranscript;
    endRecordingUI();
    if (finalText) sendMessage(finalText, false);
    else addAssistantMessage().innerHTML = '<div class="error-box">Didn\'t catch any speech, try again.</div>';
  };

  // timeslice: fires ondataavailable periodically while still recording, so
  // we have something to re-transcribe for the live caption without waiting
  // for the whole recording to finish.
  mediaRecorder.start(LIVE_TRANSCRIBE_INTERVAL_MS);
  beginRecordingUI();

  liveTranscribeTimer = setInterval(() => transcribeCurrentRecording(false), LIVE_TRANSCRIBE_INTERVAL_MS);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
}

async function transcribeCurrentRecording(isFinal) {
  // Skip overlapping calls, and wait for at least 2 chunks — a lone first
  // chunk is sometimes not yet a fully decodable container.
  if (transcribing || recordedChunks.length < 2) return isFinal ? '' : undefined;
  transcribing = true;
  try {
    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const form = new FormData();
    const ext = (blob.type.split('/')[1] || 'webm').split(';')[0];
    form.append('file', blob, `recording.${ext}`);

    let resp, data;
    try {
      resp = await fetch('/transcribe', { method: 'POST', body: form });
      data = await resp.json();
    } catch {
      return isFinal ? '' : undefined; // transient failure — try again next tick unless this was the final call
    }
    if (!resp.ok) return isFinal ? '' : undefined;

    liveCaptionEl.textContent = data.text || 'Say something...';
    textInput.value = data.text || '';
    if (data.text) lastTranscript = data.text;
    return data.text || '';
  } finally {
    transcribing = false;
  }
}

// --- Query execution -------------------------------------------------------

async function sendMessage(text, confirm, existingBubble, forUserText) {
  if (!text.trim()) return;

  let bubble;
  if (existingBubble) {
    bubble = existingBubble;
    bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
  } else {
    addUserMessage(text);
    bubble = addAssistantMessage();
  }

  let resp, data;
  try {
    resp = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: forUserText || text, confirm, history: conversationHistory, table: activeTable }),
    });
    data = await resp.json();
  } catch (err) {
    bubble.innerHTML = `<div class="error-box">Request failed: ${err}</div>`;
    return;
  }

  if (!resp.ok) {
    bubble.innerHTML = `<div class="error-box">${(data && data.detail) || resp.statusText}</div>`;
    return;
  }

  if (data.requires_confirmation) {
    renderConfirm(bubble, data, forUserText || text);
    return;
  }

  renderResult(bubble, data);

  conversationHistory.push({ text: forUserText || text, sql: data.sql });
  conversationHistory = conversationHistory.slice(-5);
}

function renderConfirm(bubble, data, originalText) {
  bubble.innerHTML = '';
  bubble.appendChild(sqlBlock(data));
  bubble.appendChild(tableBlock(data.columns, data.rows));

  const box = document.createElement('div');
  box.className = 'confirm-box';
  const label = document.createElement('span');
  label.textContent = `This will affect ${data.rows.length} row(s). Run it?`;
  const yesBtn = document.createElement('button');
  yesBtn.className = 'primary';
  yesBtn.textContent = 'Yes, run it';
  yesBtn.addEventListener('click', () => sendMessage(originalText, true, bubble, originalText));
  const noBtn = document.createElement('button');
  noBtn.className = 'secondary';
  noBtn.textContent = 'Cancel';
  noBtn.addEventListener('click', () => {
    box.remove();
    const note = document.createElement('div');
    note.className = 'status-line';
    note.textContent = 'Cancelled.';
    bubble.appendChild(note);
  });
  box.append(label, yesBtn, noBtn);
  bubble.appendChild(box);
  scrollToBottom();
}

function renderResult(bubble, data) {
  bubble.innerHTML = '';

  if (data.is_diagram) {
    // Explanatory diagram (flowchart/ER/sequence diagram of the dataset's
    // structure) — no SQL, no rows, just the Mermaid diagram itself.
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = data.chart;
    bubble.appendChild(div);
    mermaid.run({ nodes: [div] }).then(scrollToBottom);
    return;
  }

  bubble.appendChild(sqlBlock(data));

  if (data.rows.length === 1 && data.columns.length === 1) {
    const div = document.createElement('div');
    div.className = 'scalar';
    div.textContent = `${data.columns[0]}: ${data.rows[0][0]}`;
    bubble.appendChild(div);
    scrollToBottom();
    return;
  }

  if (data.is_mermaid) {
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = data.chart;
    bubble.appendChild(div);
    mermaid.run({ nodes: [div] }).then(scrollToBottom);
  }
  bubble.appendChild(tableBlock(data.columns, data.rows));
  scrollToBottom();
}

function sqlBlock(data) {
  const div = document.createElement('div');
  div.className = 'sql';
  div.textContent = `${data.source}: ${data.sql}`;
  return div;
}

function tableBlock(columns, rows) {
  const wrap = document.createElement('div');
  if (!rows.length) {
    wrap.textContent = 'No rows.';
    return wrap;
  }
  wrap.className = 'table-scroll';
  const table = document.createElement('table');
  const thead = document.createElement('tr');
  columns.forEach(c => { const th = document.createElement('th'); th.textContent = c; thead.appendChild(th); });
  table.appendChild(thead);
  rows.slice(0, 200).forEach(row => {
    const tr = document.createElement('tr');
    row.forEach(v => { const td = document.createElement('td'); td.textContent = v === null ? '' : v; tr.appendChild(td); });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}
